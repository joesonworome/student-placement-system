<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Placement Prediction System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #e8eaef;
            color: #1f2937;
            min-height: 100vh;
        }

        .sidebar {
            min-height: 100vh;
            background: linear-gradient(180deg, #03141f 0%, #071d2a 100%);
            border-right: 1px solid rgba(251, 79, 20, 0.2);
        }

        .sidebar .nav-link {
            color: rgba(255, 255, 255, .85);
            font-weight: 600;
            padding: 1rem;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            color: white;
            background: rgba(251, 79, 20, .18);
            box-shadow: inset 0 0 0 1px rgba(251, 79, 20, .12);
        }

        .sidebar .nav-link i {
            margin-right: 10px;
        }

        .main-content {
            background-color: rgba(255, 255, 255, 0.95);
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .card {
            border: 1px solid rgba(251, 79, 20, .12);
            background: rgba(3, 12, 23, .96);
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, .35);
            transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(251, 79, 20, .25);
            box-shadow: 0 24px 50px rgba(0, 0, 0, .45);
        }

        .stat-card {
            background: linear-gradient(135deg, #081725 0%, #16344c 100%);
            color: #f8fafc;
            border-radius: 18px;
            padding: 1.5rem;
            box-shadow: 0 18px 28px rgba(0, 0, 0, .25);
        }

        .stat-icon i {
            color: #fb4f14;
            font-size: 1.8rem;
        }

        .chart-container {
            position: relative;
            height: 400px;
            margin: 20px 0;
            padding: 1.5rem;
            background: rgba(5, 10, 22, .94);
            border: 1px solid rgba(251, 79, 20, .12);
            border-radius: 20px;
        }

        .logout-btn {
            width: 100%;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, .9);
            font-weight: 600;
            padding: 1rem;
            text-align: left;
        }

        .logout-btn:hover {
            color: #fb4f14;
            background: rgba(251, 79, 20, .08);
        }

        .logout-form {
            margin: 0;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            align-items: center;
            padding: 1.5rem;
            background: rgba(4, 14, 26, .88);
            border: 1px solid rgba(251, 79, 20, .15);
            border-radius: 24px;
            margin-bottom: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .25);
        }

        .welcome-text h2 {
            color: #fb4f14;
        }

        .welcome-text p {
            color: #cbd5e1;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            margin-bottom: 24px;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            margin-bottom: 24px;
        }

        .feature-card {
            display: block;
            background: linear-gradient(135deg, #041023 0%, #0f2347 100%);
            color: #e2e8f0;
            padding: 1.6rem;
            border-radius: 20px;
            border: 1px solid rgba(251, 79, 20, .16);
            text-decoration: none;
            transition: transform .25s, box-shadow .25s, border-color .25s;
        }

        .feature-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 18px 45px rgba(0, 0, 0, .35);
            border-color: rgba(251, 79, 20, .3);
        }

        .feature-icon {
            font-size: 2rem;
            margin-bottom: 14px;
        }

        .team-section .card {
            background: rgba(6, 16, 30, .96);
            border: 1px solid rgba(251, 79, 20, .18);
        }

        .card-header {
            background: linear-gradient(135deg, #ff7c32 0%, #fb4f14 100%);
            color: #0f172a;
            border-radius: 18px 18px 0 0;
        }

        .team-member h4 {
            color: #f8fafc;
        }

        .team-member p {
            color: #cbd5e1;
        }

        .team-section p {
            color: #cbd5e1;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar">
                <div class="position-sticky pt-3">
                    <div class="text-center text-white mb-4">
                        <h4><i class="bi bi-graph-up"></i> Placement Predictor</h4>
                    </div>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}"
                                href="{% url 'dashboard' %}">
                                <i class="bi bi-speedometer2"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'upload_data' %}active{% endif %}"
                                href="{% url 'upload_data' %}">
                                <i class="bi bi-upload"></i> Upload Data
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'upload_data' %}active{% endif %}"
                                href="{% url 'upload_data' %}">
                                <i class="bi bi-gear"></i> Preprocess Data
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'train_model' %}active{% endif %}"
                                href="{% url 'ml_engine:train_model' %}">
                                <i class="bi bi-cpu"></i> Train Model
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'predict' %}active{% endif %}"
                                href="{% url 'ml_engine:predict' %}">
                                <i class="bi bi-magic"></i> Make Predictions
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'generate_report' %}active{% endif %}"
                                href="{% url 'reports:generate_report' %}">
                                <i class="bi bi-file-earmark-text"></i> Reports
                            </a>
                        </li>

                        <li class="nav-item mt-4">
                            <form method="post" action="{% url 'logout' %}" class="logout-form">
                                {% csrf_token %}
                                <button type="submit" class="logout-btn">
                                    <i class="bi bi-box-arrow-right"></i> Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
                {% if messages %}
                {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show mt-3" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endfor %}
                {% endif %}

                {% block content %}
                {% endblock %}
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    {% block scripts %}
    {% endblock %}
</body>

</html>
